name: LinkedIn Subsystem Regression

on:
  push:
    branches: [mark3-development]
    paths:
      - 'mark3-development/core/linkedin-*.js'
      - 'mark3-development/core/apollo-enrichment.js'
      - 'mark3-development/scripts/linkedin-*.js'
      - 'mark3-development/scripts/apollo-company-identity-selftest.js'
      - 'mark3-development/scripts/linkedin-*.py'
      - 'mark3-development/.env.example'
      - 'mark3-development/package.json'
      - '.github/workflows/linkedin-subsystem.yml'
  pull_request:
    paths:
      - 'mark3-development/core/linkedin-*.js'
      - 'mark3-development/core/apollo-enrichment.js'
      - 'mark3-development/scripts/linkedin-*.js'
      - 'mark3-development/scripts/apollo-company-identity-selftest.js'
      - 'mark3-development/scripts/linkedin-*.py'
      - 'mark3-development/.env.example'
      - 'mark3-development/package.json'
      - '.github/workflows/linkedin-subsystem.yml'

jobs:
  linkedin-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create non-secret test environment
        run: cp .env.example .env
      - name: Install Mark 3 dependencies
        working-directory: mark3-development
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Smoke-test official MCP client SDK
        working-directory: mark3-development
        run: node --input-type=module -e "await import('@modelcontextprotocol/client'); await import('@modelcontextprotocol/client/stdio'); console.log('Official MCP client SDK imports passed.')"
      - name: Run LinkedIn account subsystem regression
        working-directory: mark3-development
        run: node --env-file=../.env scripts/linkedin-account-selftest.js
      - name: Test persistent LinkedIn mission runner
        working-directory: mark3-development
        run: node --env-file=../.env scripts/linkedin-mission-runner-selftest.js
      - name: Test saved LinkedIn discovery resume
        working-directory: mark3-development
        run: node --env-file=../.env scripts/linkedin-saved-resume-selftest.js
      - name: Test zero-budget missions wait instead of completing empty
        working-directory: mark3-development
        run: node --env-file=../.env scripts/linkedin-zero-budget-resume-selftest.js
      - name: Test cache-only SAP verification
        working-directory: mark3-development
        run: node --env-file=../.env scripts/linkedin-cache-only-verification-selftest.js
      - name: Test canonical LinkedIn Final Master
        working-directory: mark3-development
        run: node --env-file=../.env scripts/linkedin-final-master-selftest.js
      - name: Test LinkedIn lead scraper deletion safety
        working-directory: mark3-development
        run: node --env-file=../.env scripts/linkedin-lead-scraper-safety-selftest.js
      - name: Test Apollo company priority and exact-person enrichment
        working-directory: mark3-development
        run: node --env-file=../.env scripts/apollo-company-identity-selftest.js
      - name: Test agentic LinkedIn mission foundation
        working-directory: mark3-development
        run: node --env-file=../.env scripts/linkedin-agentic-foundation-selftest.js
      - name: Test typed LinkedIn request compiler
        working-directory: mark3-development
        run: node --env-file=../.env scripts/linkedin-request-compiler-selftest.js
      - name: Test explicit contact intent
        working-directory: mark3-development
        env:
          ULTRON_LINKEDIN_COMMAND_TEST_GROUP: intent
        run: node --env-file=../.env scripts/linkedin-command-router-selftest.js
      - name: Test generic locations and topics
        working-directory: mark3-development
        env:
          ULTRON_LINKEDIN_COMMAND_TEST_GROUP: location
        run: node --env-file=../.env scripts/linkedin-command-router-selftest.js
      - name: Test LinkedIn workspace routing
        working-directory: mark3-development
        env:
          ULTRON_LINKEDIN_COMMAND_TEST_GROUP: workspace
        run: node --env-file=../.env scripts/linkedin-command-router-selftest.js
      - name: Test LinkedIn mission refinements
        working-directory: mark3-development
        env:
          ULTRON_LINKEDIN_COMMAND_TEST_GROUP: refinement
        run: node --env-file=../.env scripts/linkedin-command-router-selftest.js
      - name: Test LinkedIn Sheet commands
        working-directory: mark3-development
        env:
          ULTRON_LINKEDIN_COMMAND_TEST_GROUP: sheet
        run: node --env-file=../.env scripts/linkedin-command-router-selftest.js
