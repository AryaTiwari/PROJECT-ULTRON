name: LinkedIn Subsystem Regression

on:
  push:
    branches: [mark3-development]
    paths:
      - 'mark3-development/core/linkedin-*.js'
      - 'mark3-development/scripts/linkedin-*.js'
      - 'mark3-development/scripts/linkedin-*.py'
      - 'mark3-development/.env.example'
      - '.github/workflows/linkedin-subsystem.yml'
  pull_request:
    paths:
      - 'mark3-development/core/linkedin-*.js'
      - 'mark3-development/scripts/linkedin-*.js'
      - 'mark3-development/scripts/linkedin-*.py'
      - 'mark3-development/.env.example'
      - '.github/workflows/linkedin-subsystem.yml'

jobs:
  linkedin-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create non-secret test environment
        run: cp .env.example .env
      - name: Run LinkedIn account subsystem regression
        working-directory: mark3-development
        run: node --env-file=../.env scripts/linkedin-account-selftest.js
      - name: Test explicit contact intent
        working-directory: mark3-development
        env:
          ULTRON_LINKEDIN_COMMAND_TEST_GROUP: intent
        run: node --env-file=../.env scripts/linkedin-command-router-selftest.js
      - name: Test generic locations and topics
        working-directory: mark3-development
        env:
          ULTRON_LINKEDIN_COMMAND_TEST_GROUP: location
        run: node --env-file=../.env scripts/linkedin-command-router-selftest.js
      - name: Test LinkedIn workspace routing
        working-directory: mark3-development
        env:
          ULTRON_LINKEDIN_COMMAND_TEST_GROUP: workspace
        run: node --env-file=../.env scripts/linkedin-command-router-selftest.js
      - name: Test LinkedIn mission refinements
        working-directory: mark3-development
        env:
          ULTRON_LINKEDIN_COMMAND_TEST_GROUP: refinement
        run: node --env-file=../.env scripts/linkedin-command-router-selftest.js
      - name: Test LinkedIn Sheet commands
        working-directory: mark3-development
        env:
          ULTRON_LINKEDIN_COMMAND_TEST_GROUP: sheet
        run: node --env-file=../.env scripts/linkedin-command-router-selftest.js
