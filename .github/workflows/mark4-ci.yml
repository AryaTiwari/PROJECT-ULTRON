name: Mark4 CI

on:
  push:
    branches: [mark4-development]
    paths:
      - "mark4-development/**"
      - ".github/workflows/mark4-ci.yml"
  pull_request:
    paths:
      - "mark4-development/**"
      - ".github/workflows/mark4-ci.yml"

jobs:
  mark4:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mark4-development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: npm install
      - name: Install Linux native optional runtimes
        run: npm install --no-save @img/sharp-linux-x64@0.34.5 @img/sharp-libvips-linux-x64@1.2.4 @rollup/rollup-linux-x64-gnu@4.63.3 @esbuild/linux-x64@0.28.2
      - name: Google auth integrity
        run: npm run check:google-auth-integrity
      - run: npm run check
