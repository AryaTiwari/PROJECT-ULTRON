name: Mark 3 Preflight

on:
  push:
    branches: [mark3-development]
    paths:
      - 'mark3-development/**'
      - 'core/omniroute.js'
      - 'core/credentials/**'
      - '.env.example'
      - '.github/workflows/mark3-preflight.yml'
  pull_request:
    paths:
      - 'mark3-development/**'
      - 'core/omniroute.js'
      - 'core/credentials/**'
      - '.env.example'
      - '.github/workflows/mark3-preflight.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for real Reel render acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Create non-secret test environment
        run: cp .env.example .env
      - name: Run Mark 3 preflight
        working-directory: mark3-development
        run: npm run preflight
      - name: Run LinkedIn account subsystem regression
        working-directory: mark3-development
        run: npm run check:linkedin-account
      - name: Render full 30-second Elevate visual acceptance Reel
        working-directory: mark3-development
        run: node --env-file=../.env scripts/reel-visual-acceptance.js

  windows-character-assets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows transparent character sprite builder
        shell: powershell
        working-directory: mark3-development
        run: .\scripts\reel-sprite-builder-windows-test.ps1
