<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ULTRON Mark 2 Test Console</title><style>body{background:#07090c;color:#e8edf2;font-family:Segoe UI,Arial;margin:0;padding:24px}main{max-width:900px;margin:auto}.panel{background:#11161c;border:1px solid #29323b;border-radius:14px;padding:18px;margin-bottom:16px}.status{font-family:monospace;font-size:13px;white-space:pre-wrap}.chat{height:420px;overflow:auto;background:#090c10;border-radius:10px;padding:12px}.msg{margin:10px 0;padding:10px 12px;border-radius:10px;white-space:pre-wrap}.u{background:#18232d}.a{background:#121923}.row{display:flex;gap:8px}.row>*{flex:1}textarea{width:100%;box-sizing:border-box;background:#0c1116;color:#fff;border:1px solid #313b45;border-radius:10px;padding:12px}button{background:#1e2b36;color:#fff;border:1px solid #3d4b57;padding:10px 14px;border-radius:9px;cursor:pointer}button:hover{background:#283846}</style></head><body><main><h1>ULTRON</h1><div class="panel"><b>Mark 2 Temporary Test Console</b><div id="status" class="status">loading...</div><div class="row"><button onclick="startVoice()">Start Voice</button><button onclick="stopVoice()">Stop Voice</button><button onclick="diagnose()">Diagnose</button></div></div><div class="panel"><div id="chat" class="chat"></div><textarea id="input" rows="3" placeholder="Type to ULTRON..."></textarea><div class="row"><button onclick="send()">Send</button><button onclick="speakTest()">Speak Test</button></div></div></main><script>const chat=document.getElementById('chat'),status=document.getElementById('status'),input=document.getElementById('input');function add(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'u':'a');d.textContent=(role==='user'?'YOU: ':'ULTRON: ')+text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function j(url,opt){const r=await fetch(url,opt);return r.json()}async function refresh(){const [h,v]=await Promise.all([j('/health'),j('/api/voice/status')]);status.textContent=JSON.stringify({health:h,voice:v},null,2)}async function send(){const m=input.value.trim();if(!m)return;add('user',m);input.value='';const r=await j('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});add('assistant',r.response||r.error||JSON.stringify(r));refresh()}async function startVoice(){const r=await j('/api/voice/daemon/start',{method:'POST'});add('assistant',JSON.stringify(r));refresh()}async function stopVoice(){const r=await j('/api/voice/daemon/stop',{method:'POST'});add('assistant',JSON.stringify(r));refresh()}async function diagnose(){const r=await j('/api/maintenance');add('assistant',JSON.stringify(r,null,2));refresh()}async function speakTest(){const r=await j('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'ULTRON voice test successful.'})});add('assistant',JSON.stringify(r));if(r.path){const a=new Audio('/api/audio?path='+encodeURIComponent(r.path));a.play().catch(()=>{})}refresh()}input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});refresh();setInterval(refresh,5000);</script></body></html>
