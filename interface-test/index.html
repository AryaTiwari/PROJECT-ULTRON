<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ULTRON Mark 2 Test Console</title><style>body{margin:0;background:#05070a;color:#e9eef5;font:15px system-ui,Segoe UI,Arial;min-height:100vh}main{max-width:900px;margin:0 auto;padding:28px}h1{letter-spacing:.12em}#status{padding:10px 14px;border:1px solid #26313d;border-radius:10px;margin:12px 0 20px;color:#9fb0c2}#chat{height:55vh;overflow:auto;border:1px solid #26313d;border-radius:14px;padding:16px;background:#090d12}.msg{margin:10px 0;padding:12px 14px;border-radius:12px;white-space:pre-wrap}.user{background:#112033}.assistant{background:#15191f}.row{display:flex;gap:10px;margin-top:14px}textarea{flex:1;min-height:80px;background:#0b1016;color:#fff;border:1px solid #26313d;border-radius:12px;padding:12px}button{background:#1c2732;color:#fff;border:1px solid #354454;border-radius:10px;padding:0 18px;cursor:pointer}button:hover{background:#263443}small{color:#7e8d9c}</style></head>
<body><main><h1>ULTRON</h1><small>Mark 2 temporary test console · final Google AI Studio interface will replace this.</small><div id="status">Checking Core…</div><div id="chat"></div><div class="row"><textarea id="input" placeholder="Type a message to ULTRON…"></textarea><button id="send">SEND</button></div></main><script>
const API='http://127.0.0.1:8787'; const chat=document.getElementById('chat'); const status=document.getElementById('status'); const input=document.getElementById('input');
function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function check(){try{const r=await fetch(API+'/health');const j=await r.json();status.textContent=j.ok?'CORE ONLINE · '+(j.runtime||'mark2'):'CORE ERROR';}catch(e){status.textContent='CORE OFFLINE · start npm run core:start';}}
async function send(){const message=input.value.trim();if(!message)return;add('user',message);input.value='';try{const r=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,source:'test-ui'})});const j=await r.json();add('assistant',j.response||j.error||JSON.stringify(j,null,2));}catch(e){add('assistant','Connection error: '+e.message)}}
document.getElementById('send').onclick=send; input.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))send()}); check(); setInterval(check,5000);
</script></body></html>
