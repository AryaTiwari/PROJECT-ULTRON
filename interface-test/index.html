<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ULTRON Mark 2 Test Console</title><style>body{margin:0;background:#05070a;color:#e9eef5;font:15px system-ui,Segoe UI,Arial}main{max-width:920px;margin:auto;padding:24px}.panel{border:1px solid #26313d;background:#0b1016;border-radius:14px;padding:16px;margin:14px 0}h1{letter-spacing:.12em;margin-bottom:4px}.status{font-family:monospace;font-size:12px;color:#9fb0c2;white-space:pre-wrap}.chat{height:52vh;overflow:auto;border:1px solid #26313d;border-radius:12px;padding:12px;background:#070b10}.msg{margin:9px 0;padding:11px 13px;border-radius:11px;white-space:pre-wrap}.user{background:#102239}.assistant{background:#151a21}.row{display:flex;gap:8px;margin-top:10px}textarea{flex:1;min-height:76px;resize:vertical;background:#090e14;color:#fff;border:1px solid #2b3743;border-radius:10px;padding:12px}button{background:#1a2631;color:#fff;border:1px solid #354454;border-radius:9px;padding:10px 14px;cursor:pointer}button:hover{background:#263846}button.good{border-color:#496f55}button.stop{border-color:#7f4f4f}audio{width:100%;margin-top:10px}</style></head><body><main><h1>ULTRON</h1><div class="panel"><b>Mark 2 Temporary Test Console</b><div id="status" class="status">Checking…</div><div class="row"><button class="good" onclick="startVoice()">START VOICE</button><button class="stop" onclick="stopVoice()">STOP VOICE</button><button onclick="speakTest()">TEST VOICE</button><button onclick="diagnose()">DIAGNOSE</button></div><audio id="player" controls></audio></div><div class="panel"><div id="chat" class="chat"></div><div class="row"><textarea id="input" placeholder="Type to ULTRON… (Ctrl+Enter to send)"></textarea><button onclick="send()">SEND</button></div></div></main><script>const chat=document.getElementById('chat'),status=document.getElementById('status'),input=document.getElementById('input'),player=document.getElementById('player');function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=(role==='user'?'YOU: ':'ULTRON: ')+text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function j(url,opt){const r=await fetch(url,opt);const text=await r.text();let data={};try{data=JSON.parse(text)}catch{data={raw:text}}if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}async function refresh(){try{const[h,v]=await Promise.all([j('/health'),j('/api/voice/status')]);status.textContent=JSON.stringify({core:h,voice:v},null,2)}catch(e){status.textContent='CORE OFFLINE/ERROR: '+e.message}}async function send(){const m=input.value.trim();if(!m)return;add('user',m);input.value='';try{const r=await j('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,source:'test-ui'})});add('assistant',r.response||r.error||JSON.stringify(r,null,2))}catch(e){add('assistant','Connection error: '+e.message)}refresh()}async function startVoice(){try{const r=await j('/api/voice/daemon/start',{method:'POST'});add('assistant',r.ok?'Voice daemon started. Say ULTRON.':JSON.stringify(r))}catch(e){add('assistant','Voice start failed: '+e.message)}refresh()}async function stopVoice(){try{await j('/api/voice/daemon/stop',{method:'POST'});add('assistant','Voice daemon stopped.')}catch(e){add('assistant','Voice stop failed: '+e.message)}refresh()}async function speakTest(){add('assistant','Generating ULTRON voice…');try{const r=await j('/api/tts/play',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'ULTRON voice test successful.'})});if(r.playback?.played){add('assistant','Fish Audio generated and Windows playback completed.')}else{add('assistant',JSON.stringify(r,null,2))}}catch(e){add('assistant','VOICE PLAYBACK FAILED: '+e.message)}refresh()}async function diagnose(){try{const r=await j('/api/maintenance');add('assistant',JSON.stringify(r,null,2))}catch(e){add('assistant','Diagnostic failed: '+e.message)}refresh()}input.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}});refresh();setInterval(refresh,4000);</script></body></html>
