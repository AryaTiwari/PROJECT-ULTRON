<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <title>ULTRON — Personal AI</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">U</div>
          <div>
            <div class="brand-name">ULTRON</div>
            <div class="brand-subtitle">PERSONAL AI SYSTEM</div>
          </div>
        </div>

        <div class="topbar-controls">
          <button id="newChat" class="status-pill" type="button" title="Start a new conversation">
            <span>NEW CHAT</span>
          </button>
          <button id="voiceToggle" class="status-pill" type="button" aria-pressed="true" title="Toggle automatic ULTRON voice replies">
            <span class="pill-indicator"></span>
            <span id="voiceToggleText">VOICE ON</span>
          </button>
          <button id="wakeToggle" class="status-pill" type="button" aria-pressed="false" title="Toggle the ULTRON wake word listener">
            <span class="pill-indicator"></span>
            <span id="wakeToggleText">WAKE OFF</span>
          </button>
          <div class="system-status" id="systemStatus" aria-live="polite">
            <span class="status-dot"></span>
            <span id="statusText">CORE READY</span>
          </div>
        </div>
      </header>

      <section class="hero" id="hero">
        <div class="orb-wrap" id="orbWrap" aria-label="ULTRON voice state">
          <div class="orb-ring ring-one"></div>
          <div class="orb-ring ring-two"></div>
          <div class="orb-core"><span>U</span></div>
        </div>

        <p class="eyebrow">ULTRON CORE</p>
        <h1>What do you need?</h1>
        <p class="hero-copy">Memory, reasoning, routing, tools and voice are connected. Give ULTRON a task.</p>
        <div class="voice-meta" id="voiceMeta">
          <span id="voiceStateText">VOICE READY</span>
          <span class="meta-separator">•</span>
          <span id="wakeStateText">WAKE WORD OFF</span>
        </div>
      </section>

      <section class="conversation" id="conversation" aria-live="polite"></section>

      <form class="composer" id="composer">
        <textarea
          id="messageInput"
          rows="1"
          autocomplete="off"
          placeholder="Ask ULTRON anything..."
          aria-label="Message ULTRON"
        ></textarea>
        <button id="sendButton" type="submit" aria-label="Send message">
          <span>↑</span>
        </button>
      </form>

      <footer class="footer">
        <span>LOCAL INTERFACE</span>
        <span>•</span>
        <span>MEMORY ENABLED</span>
        <span>•</span>
        <span>VOICE READY</span>
        <span>•</span>
        <span>WAKE WORD: ULTRON</span>
      </footer>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
